<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Drive Pilot</title><style>body{font:17px/1.7 system-ui,sans-serif;max-width:760px;margin:56px auto;padding:0 24px;color:#202830;background:#fafafa}a{color:#175b9b}h1{line-height:1.25}footer{margin-top:40px;color:#59636d}</style></head><body><main><h1>Hermes Drive Pilot</h1><p>自用私有文件交接工具</p><p>Hermes Drive Pilot 将拥有者授权的服务器文件传到拥有者的 Google Drive，用于取回和核对。应用不提供公众注册。</p><p>应用通过 Google Drive OAuth 请求拥有者同意。当前权限范围包括查看、创建、修改和删除 Google Drive 文件；实际用途是指定工作文件夹中的文件交接。</p><p><a href="privacy.html">隐私政策</a></p><footer>这是应用说明页面，不代表应用已获 Google 验证。</footer></main></body></html>
